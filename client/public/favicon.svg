<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The TempHire orb (.temphire-orb in styles.css) wearing the React logo (FrameworkMark). -->
  <defs>
    <radialGradient id="orb" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#3a86c8" />
      <stop offset=".7" stop-color="#1d5380" />
      <stop offset="1" stop-color="#12385a" />
    </radialGradient>
    <radialGradient id="shine" cx="32%" cy="28%" r="40%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="26" cy="26" r="25" fill="url(#orb)" />
  <circle cx="26" cy="26" r="25" fill="url(#shine)" />
  <text x="26" y="36.5" text-anchor="middle" font-family="Verdana, sans-serif" font-weight="700" font-size="30" fill="#ffffff">T</text>
  <circle cx="46" cy="46" r="17" fill="#20232a" />
  <g transform="translate(46 46) scale(1.15)" stroke="#61dafb" stroke-width="1" fill="none">
    <circle r="2.05" fill="#61dafb" stroke="none" />
    <ellipse rx="11" ry="4.2" />
    <ellipse rx="11" ry="4.2" transform="rotate(60)" />
    <ellipse rx="11" ry="4.2" transform="rotate(120)" />
  </g>
</svg>
